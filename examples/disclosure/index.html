<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elm web components example</title>
    <script src="../../dist/disclosure.js" defer></script>
    <style>
      ui-disclosure::part(trigger) {
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }

      ui-disclosure::part(panel) {
        padding: 0.75rem;
        border: 1px solid #aaa;
      }
    </style>
  </head>
  <body>
    <ui-disclosure label="More details">
      This content comes from the host page's slot.
    </ui-disclosure>
    <p id="status">Closed</p>
    <script>
      document.querySelector("ui-disclosure").addEventListener("toggle", (event) => {
        document.querySelector("#status").textContent =
          event.detail.open ? "Open" : "Closed";
      });
    </script>
  </body>
</html>
